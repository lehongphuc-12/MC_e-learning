services:
  # =======================================================
  # 1. FRONTEND & NGINX GATEWAY (React SPA + Reverse Proxy)
  # =======================================================
  frontend:
    build:
      context: ./MC_FE
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: mc_fe
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - mc-network

  # =======================================================
  # 2. BACKEND API (.NET 9 + FFmpeg)
  # =======================================================
  backend:
    build:
      context: ./MC_BE
      dockerfile: Dockerfile
    container_name: mc_be
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedHosts: "*"
      ClientUrl: ${CLIENT_URL:-http://localhost}
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING}
      Cors__AllowedOrigins__0: ${CLIENT_URL:-http://localhost}
      Cors__AllowedOrigins__1: ${CORS_EXTRA_ORIGIN:-http://localhost:3000}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:5241}
      Jwt__Audience: ${JWT_AUDIENCE:-http://localhost:5241}
      Jwt__ExpiryInMinutes: ${JWT_EXPIRY_MINUTES:-15}
      Jwt__RefreshTokenExpiryInDays: ${JWT_REFRESH_DAYS:-7}
      MentorChat__BaseUrl: http://mentorchat:8000
      MentorChat__ApiKey: ${MENTORCHAT_INTERNAL_API_KEY}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      PayOS__ClientId: ${PAYOS_CLIENT_ID}
      PayOS__ApiKey: ${PAYOS_API_KEY}
      PayOS__ChecksumKey: ${PAYOS_CHECKSUM_KEY}
      PayOS__ReturnUrl: ${PAYOS_RETURN_URL}
      PayOS__CancelUrl: ${PAYOS_CANCEL_URL}
      PayOS__WebhookUrl: ${PAYOS_WEBHOOK_URL}
      VnPay__TmnCode: ${VNPAY_TMN_CODE}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET}
      VnPay__PaymentUrl: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__ApiUrl: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VnPay__ReturnUrl: ${VNPAY_RETURN_URL}
      VnPay__FrontendResultUrl: ${VNPAY_FRONTEND_RESULT_URL}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      EmailSettings__SmtpServer: ${SMTP_SERVER:-smtp.gmail.com}
      EmailSettings__SmtpPort: ${SMTP_PORT:-587}
      EmailSettings__SenderEmail: ${SMTP_SENDER_EMAIL}
      EmailSettings__SenderName: ${SMTP_SENDER_NAME:-MSEEK Support}
      EmailSettings__Username: ${SMTP_USERNAME}
      EmailSettings__Password: ${SMTP_PASSWORD}
      CloudflareR2__AccountId: ${R2_ACCOUNT_ID}
      CloudflareR2__AccessKey: ${R2_ACCESS_KEY}
      CloudflareR2__SecretKey: ${R2_SECRET_KEY}
      CloudflareR2__BucketName: ${R2_BUCKET_NAME}
      CloudflareR2__ServiceUrl: ${R2_SERVICE_URL}
      Groq__ApiKey: ${GROQ_API_KEY}
      Groq__Model: ${GROQ_MODEL:-whisper-large-v3}
      OpenAI__Model: ${OPENAI_MODEL:-GPT-6-Luna}
      OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://aiportalapi.stu-platform.live/use}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__TimeoutSeconds: ${OPENAI_TIMEOUT:-90}
      VoiceAssessmentAI__BaseUrl: ${VOICE_ASSESSMENT_BASE_URL:-https://nozero23061311-mseek-v4b-pronunciation-api.hf.space}
    ports:
      # Expose port backend neu muon truy cap truc tiep (tuy chon)
      - "${BACKEND_PORT:-5239}:8080"
    depends_on:
      - mentorchat
    networks:
      - mc-network

  # =======================================================
  # 3. MENTOR CHAT SERVICE (FastAPI Python RAG Service)
  # =======================================================
  mentorchat:
    build:
      context: ./MC_MentorChat
      dockerfile: Dockerfile
    container_name: mc_mentorchat
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: ${MENTORCHAT_INTERNAL_API_KEY}
      ALLOWED_ORIGINS: "${CLIENT_URL:-http://localhost},http://backend:8080,http://localhost:3000,http://localhost:5173"
      LLM_PROVIDER: ${LLM_PROVIDER:-portal}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://aiportalapi.stu-platform.live/jpe}
      PORTAL_API_KEY: ${PORTAL_API_KEY}
      PORTAL_MODEL: ${PORTAL_MODEL:-Claude-Opus-4.5}
      PORTAL_MAX_TOKENS: ${PORTAL_MAX_TOKENS:-1024}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-course_knowledge}
      VECTOR_SIZE: ${VECTOR_SIZE:-768}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-180}
      MIN_RELEVANCE_SCORE: ${MIN_RELEVANCE_SCORE:-0.48}
    ports:
      # Expose port mentorchat neu muon goi truc tiep (tuy chon)
      - "${MENTORCHAT_PORT:-8000}:8000"
    networks:
      - mc-network

  # =======================================================
  # 4. OPTIONAL: LOCAL POSTGRESQL (Dung neu khong dung Supabase Cloud)
  # Khoi dong bang: docker compose --profile local-db up -d
  # =======================================================
  postgres:
    image: postgres:16-alpine
    container_name: mc_postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mseek_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - mc-network

  # =======================================================
  # 5. OPTIONAL: LOCAL QDRANT (Dung neu khong dung Qdrant Cloud)
  # Khoi dong bang: docker compose --profile local-qdrant up -d
  # =======================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mc_qdrant
    restart: unless-stopped
    profiles:
      - local-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${LOCAL_QDRANT_PORT:-6333}:6333"
    networks:
      - mc-network

volumes:
  postgres_data:
  qdrant_data:

networks:
  mc-network:
    driver: bridge
